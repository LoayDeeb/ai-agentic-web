services:
  - type: web
    name: ai-agentic-web
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix server install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DEFAULT_SYSTEM_PROMPT
        sync: false
      - key: ZATCA_SYSTEM_PROMPT
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: VjBRcaE3Sdto7eOqwIcc
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: NABRAH_API_KEY
        sync: false
      - key: NABRAH_API_KEY_FALLBACK
        sync: false
      - key: NABRAH_PROJECT_ID
        sync: false
      - key: NABRAH_MODEL
        value: phantom_v1
      - key: NABRAH_VOICE_ID
        value: 87f4c7b0-d9b5-45aa-8c6c-9e2ccf941912
      - key: NABRAH_SPEED
        value: 0.9
    healthCheckPath: /api/health
