services:
  - type: web
    name: zatca-agentic-demos
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: NODE_VERSION
        value: 20.18.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DEFAULT_SYSTEM_PROMPT
        sync: false
      - key: ZATCA_SYSTEM_PROMPT
        sync: false
      - key: SASO_SYSTEM_PROMPT
        sync: false
      - key: GASCO_SYSTEM_PROMPT
        sync: false
      - key: BAPTISM_SYSTEM_PROMPT
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: VjBRcaE3Sdto7eOqwIcc
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
      - key: SASO_ELEVENLABS_VOICE_ID
        sync: false
      - key: SASO_ELEVENLABS_MODEL
        sync: false
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: NABRAH_API_KEY
        sync: false
      - key: NABRAH_API_KEY_FALLBACK
        sync: false
      - key: NABRAH_PROJECT_ID
        sync: false
      - key: NABRAH_PROJECT_ID_FALLBACK
        sync: false
      - key: NABRAH_MODEL
        value: phantom_v1
      - key: NABRAH_VOICE_ID
        value: 87f4c7b0-d9b5-45aa-8c6c-9e2ccf941912
      - key: NABRAH_SPEED
        value: 0.9
